<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Faster+One&family=Merienda:wght@300..900&family=Orbitron:wght@400..900&family=Rye&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-zinc-800 overflow-x-hidden">
    <div
      id="header"
      class="fixed left-0 right-0 top-0 z-50 overflow-x-hidden"
    ></div>

    <div
      class="relative max-w-full w-full h-screen bg-cover bg-center bg-no-repeat overflow-hidden"
    >
      <img src="./assets/bg4.jpg" class="object-cover w-full h-full" />
    </div>

    <main class="absolute top-20 left-0 right-0 max-w-full w-full h-screen">
      <div
        class="bg-black/30 border-b border-t border-red-500/30 backdrop-blur-xs max-w-xl w-full h-16 m-auto text-center p-1 my-1"
      >
        <h1
          class="typewriter font-[Winky] text-4xl font-semibold md:text-5xl text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500"
        ></h1>
      </div>
      <div
        class="max-w-full h-[450px] flex flex-col justify-center items-center"
      >
        <div class="w-72 h-72 rounded-full animate-bounce">
          <img
            src="./assets/image S3.jpg"
            class="w-full h-full rounded-full object-cover"
          />
        </div>
        <div
          class="max-w-lg flex items-center justify-center w-full h-12 md:h-18 backdrop-blur-sm bg-zinc-800/50 shadow-sm shadow-pink-500 transition-all duration-500 ease-out hover:scale-105 hover:-translate-y-1 text-xl md:text-4xl text-center overflow-hidden md:rounded-sm"
        >
          <h1 class="">
            <i class="fa-solid fa-down-long fa-flip mx-1.5 text-purple-600"></i>
            <span class="text-white font-bold md:font-semibold"
              >Know More About Me</span
            >
            <i
              class="fa-solid fa-down-long fa-flip mx-1.5 text-fuchsia-500"
            ></i>
          </h1>
        </div>
      </div>
    </main>

    <script src="./script/common.js" defer></script>
  </body>
</html>
