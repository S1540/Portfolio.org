<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Orbitron:wght@400..900&family=Slabo+27px&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <style>
      /* Progress bar custom style */
      .swiper-pagination-progressbar {
        background: rgba(255, 255, 255, 0.2);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
      }
      .swiper-pagination-progressbar-fill {
        background: #1a23cf; /* sky-400 */
        border-radius: 999px;
      }

      .swiper-button-next {
        right: 20px;
      }
      .swiper-button-prev {
        left: 10px;
      }
      .swiper-button-next:hover,
      .swiper-button-prev:hover {
        background-color: rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body class="bg-zinc-800 text-white overflow-x-hidden">
    <!-- Loader -->
    <div
      id="loader"
      class="fixed inset-0 bg-zinc-900 flex items-center justify-center z-50"
    >
      <lottie-player
        src="./assets/loading.json"
        autoplay
        loop
        loading="lazy"
      ></lottie-player>
    </div>
    <!-- Fixed header -->
    <div id="header" class="sticky top-0 z-50 overflow-x-hidden"></div>

    <main class="relative">
      <div class="swiper mySwiper w-full relative">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img
              src="https://img.freepik.com/free-photo/view-futuristic-restaurant_23-2150946739.jpg?t=st=1755280818~exp=1755284418~hmac=4b93bb18f437bf5b652bbf2fe42a07990ddb79826df7537d7dea1d16cf9bff70&w=1480"
              class="w-full h-[700px] object-cover"
            />
            <div class="absolute top-[70%] z-10 font-[Lato] px-20">
              <h1
                class="text-2xl md:text-4xl font-semibold text-gray-100 text-center py-2"
              >
                More Details "
              </h1>
              <a
                href="https://api.whatsapp.com/send/?phone=7050043530&text&type=phone_number&app_absent=0"
                class="relative inline-block text-lg px-6 py-2.5 backdrop-blur-md bg-black/20 hover:bg-orange-600 text-white font-semibold rounded-md hover:border-2 border hover:border-dashed border-orange-600 hover:border-purple-400 transition-all duration-300 hover:shadow-[0_0_20px_10px_rgba(168,85,247,0.6)] active:scale-95 active:shadow-[0_0_10px_5px_rgba(168,85,247,0.4)] group"
              >
                <span class="flex items-center space-x-2">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    fill="none"
                    class="w-6 h-6 text-purple-500 group-hover:text-white transition-colors duration-300"
                  >
                    <path
                      d="M5 13l4 4L19 7"
                      stroke-width="2"
                      stroke-linejoin="round"
                      stroke-linecap="round"
                    ></path>
                  </svg>
                  <span>Contact Me</span>
                </span>
                <span
                  class="absolute inset-0 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-gradient-to-r from-purple-500/20 to-indigo-500/20"
                ></span>
              </a>
            </div>
          </div>
          <div class="swiper-slide">
            <img
              src="https://img.freepik.com/free-photo/front-view-man-living-as-digital-nomad_23-2151205399.jpg?t=st=1755280442~exp=1755284042~hmac=8a98f532579ab50ca4cbe579bf1879309e4c305a9b1ae170eb4570e8584ef103&w=1480"
              class="w-full h-[700px] object-cover"
            />
            <div class="absolute top-[70%] left-1/3 z-10 font-[Lato]">
              <h1
                class="text-2xl md:text-4xl font-semibold text-gray-100 text-center py-2"
              >
                Explore More Project
              </h1>
              <a
                href="https://api.whatsapp.com/send/?phone=7050043530&text&type=phone_number&app_absent=0"
                class="ml-20 md:ml-48 inline-block relative text-lg px-6 py-2.5 backdrop-blur-md bg-black/20 hover:bg-orange-600 text-white font-semibold rounded-md hover:border-2 border hover:border-dashed border-orange-600 hover:border-purple-400 transition-all duration-300 hover:shadow-[0_0_20px_10px_rgba(168,85,247,0.6)] active:scale-95 active:shadow-[0_0_10px_5px_rgba(168,85,247,0.4)] group"
              >
                <span class="flex items-center space-x-2">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    fill="none"
                    class="w-6 h-6 text-purple-500 group-hover:text-white transition-colors duration-300"
                  >
                    <path
                      d="M5 13l4 4L19 7"
                      stroke-width="2"
                      stroke-linejoin="round"
                      stroke-linecap="round"
                    ></path>
                  </svg>
                  <span>Project</span>
                </span>
                <span
                  class="absolute inset-0 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-gradient-to-r from-purple-500/20 to-indigo-500/20"
                ></span>
              </a>
            </div>
          </div>
          <div class="swiper-slide">
            <img
              src="https://img.freepik.com/free-photo/side-view-man-living-as-digital-nomad_23-2151205381.jpg?t=st=1755280758~exp=1755284358~hmac=d1fb313ce2bc04f3b8c2b1b1ea9a8a738d7e3de2177701660f765e65e2bc5c86&w=1480"
              class="w-full h-[700px] object-cover"
            />
            <div class="absolute top-[70%] right-10 z-10 font-[Lato] px-20">
              <h1
                class="text-2xl md:text-4xl font-semibold text-gray-100 text-center py-2"
              >
                Why Hire Me "
              </h1>
              <a
                href="https://api.whatsapp.com/send/?phone=7050043530&text&type=phone_number&app_absent=0"
                class="relative inline-block text-lg px-6 py-2.5 backdrop-blur-md bg-black/20 hover:bg-orange-600 text-white font-semibold rounded-md border hover:border-2 hover:border-dashed border-orange-600 hover:border-purple-400 transition-all duration-300 hover:shadow-[0_0_20px_10px_rgba(168,85,247,0.6)] active:scale-95 active:shadow-[0_0_10px_5px_rgba(168,85,247,0.4)] group"
              >
                <span class="flex items-center space-x-2">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    fill="none"
                    class="w-6 h-6 text-purple-500 group-hover:text-white transition-colors duration-300"
                  >
                    <path
                      d="M5 13l4 4L19 7"
                      stroke-width="2"
                      stroke-linejoin="round"
                      stroke-linecap="round"
                    ></path>
                  </svg>
                  <span>Hire Me "</span>
                </span>
                <span
                  class="absolute inset-0 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-gradient-to-r from-purple-500/20 to-indigo-500/20"
                ></span>
              </a>
            </div>
          </div>
        </div>

        <!-- Navigation arrows -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div
          class="swiper-pagination absolute bottom-0 left-0 right-0 z-10"
        ></div>
      </div>

      <div class="text-center py-5">
        <h1
          class="text-2xl md:text-4xl font-semibold font-[Orbitron] text-gray-100"
        >
          Contact For All Enquiry
        </h1>
        <span
          class="h-1 w-44 md:w-64 bg-gradient-to-r from-transparent via-amber-500 to-transparent rounded-full block mx-auto my-2"
        ></span>
      </div>

      <div
        class="scroll-reval transition-all translate-y-20 opacity-0 duration-500 ease-in-out md:flex flex-row-reverse items-center justify-center py-3"
      >
        <div>
          <div class="shrink-0 max-w-full w-full h-[450px] hidden md:block">
            <lottie-player
              src="./assets/contact us.json"
              autoplay
              loop
              loading="lazy"
              class="w-full h-[450px]"
            ></lottie-player>
          </div>
        </div>

        <div
          class="shrink-0 max-w-xl w-full h-[450px] relative overflow-hidden z-10 bg-white/10 p-8 rounded-lg shadow-md before:w-24 before:h-24 before:absolute before:bg-purple-600 before:rounded-full before:-z-10 before:blur-2xl after:w-32 after:h-32 after:absolute after:bg-sky-400 after:rounded-full after:-z-10 after:blur-xl after:top-24 after:-right-12 opacity-0 transition-all duration-500 ease-initial translate-y-20 scroll-reval cursor-wait"
        >
          <h2 class="text-2xl font-[Merienda] font-bold text-white mb-6">
            Get in Touch
          </h2>

          <form method="post" action="#">
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-300" for="name"
                >Full Name</label
              >
              <input
                class="mt-1 p-2 w-full bg-gray-700 border border-gray-600 outline-0 rounded-md text-white"
                type="text"
                required
              />
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-300" for="email"
                >Email Address</label
              >
              <input
                class="mt-1 p-2 w-full bg-gray-700 border border-gray-600 outline-0 rounded-md text-white"
                name="email"
                id="email"
                type="email"
                required
              />
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-300" for="bio"
                >Message</label
              >
              <textarea
                class="mt-1 p-2 w-full bg-gray-700 border border-gray-600 outline-0 rounded-md text-white"
                rows="3"
                name="bio"
                id="bio"
                required
              ></textarea>
            </div>

            <div class="flex justify-end">
              <button
                class="bg-gradient-to-r from-purple-600 via-purple-400 to-blue-500 text-white px-4 py-2 font-bold rounded-md hover:opacity-80"
                type="submit"
              >
                Connect
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Map Location  -->
      <div class="max-w-full w-full py-5">
        <div class="text-center py-5">
          <h1
            class="text-2xl md:text-4xl font-semibold font-[Orbitron] text-gray-100"
          >
            Location & Address
          </h1>
          <span
            class="h-1 w-44 md:w-64 bg-gradient-to-r from-transparent via-amber-500 to-transparent rounded-full block mx-auto my-2"
          ></span>
        </div>

        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d57587.34508693956!2d83.97774817829219!3d25.564710270474553!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x399275985564a721%3A0x3c49a62eeb3d93be!2sBuxar%2C%20Bihar!5e0!3m2!1sen!2sin!4v1755692688025!5m2!1sen!2sin"
          style="border: 0"
          loading="lazy"
          class="w-full h-[700px]"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </main>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      var swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: {
          delay: 3000, // 5 sec
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          type: "progressbar",
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
      });
    </script>
    <!-- <script src="./script/common.js"></script> -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="./script/script.js" defer></script>
  </body>
</html>
