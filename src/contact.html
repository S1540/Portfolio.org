      <!DOCTYPE html>
      <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          />
          <title>Tailwind Login</title>
          <script src="https://cdn.tailwindcss.com"></script>
        </head>
        <body
          class="bg-[#1f293a] flex justify-center items-center min-h-screen"
        >
          <!-- Container -->
          <div
            class="relative w-[400px] h-[400px] flex justify-center items-center rounded-full overflow-hidden"
          >
            <!-- Animated spans -->
            <div class="absolute inset-0 flex justify-center items-center">
              <!-- 50 spans create blink effect -->
              <template id="spans">
                <span
                  class="absolute left-0 w-8 h-[6px] bg-[#2c4766] rounded-full"
                ></span>
              </template>
            </div>

            <!-- Login Box -->
            <div
              class="absolute w-4/5 max-w-[300px] z-10 p-6 rounded-2xl bg-[#1f293a] shadow-lg"
            >
              <h2 class="text-2xl text-[#0ef] text-center mb-4">Login</h2>
              <form action="#" class="w-full px-2">
                <!-- Email -->
                <div class="relative my-4">
                  <input
                    type="email"
                    required
                    class="peer w-full h-11 bg-transparent border-2 border-[#2c4766] rounded-full px-4 text-white outline-none focus:border-[#0ef] transition"
                  />
                  <label
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-white text-base transition-all peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-white peer-focus:-top-2 peer-focus:text-xs peer-focus:bg-[#1f293a] peer-focus:px-1 peer-focus:text-[#0ef]"
                  >
                    Email
                  </label>
                </div>

                <!-- Password -->
                <div class="relative my-4">
                  <input
                    type="password"
                    required
                    class="peer w-full h-11 bg-transparent border-2 border-[#2c4766] rounded-full px-4 text-white outline-none focus:border-[#0ef] transition"
                  />
                  <label
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-white text-base transition-all peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-white peer-focus:-top-2 peer-focus:text-xs peer-focus:bg-[#1f293a] peer-focus:px-1 peer-focus:text-[#0ef]"
                  >
                    Password
                  </label>
                </div>

                <!-- Forgot -->
                <div class="text-center -mt-2 mb-2">
                  <a href="#" class="text-sm text-white hover:text-[#0ef]"
                    >Forgot your password?</a
                  >
                </div>

                <!-- Button -->
                <button
                  type="submit"
                  class="w-full h-11 bg-[#0ef] text-[#1f293a] font-semibold rounded-full cursor-pointer hover:opacity-90 transition"
                >
                  Login
                </button>

                <!-- Signup -->
                <div class="text-center mt-3">
                  <a href="#" class="text-[#0ef] font-semibold hover:underline"
                    >Sign Up</a
                  >
                </div>
              </form>
            </div>
          </div>

          <script>
            // Create animated 50 spans dynamically
            const container = document.querySelector(".relative");
            const template = document.getElementById("spans");
            for (let i = 0; i < 50; i++) {
              const span = template.content.firstElementChild.cloneNode(true);
              span.style.transformOrigin = "200px";
              span.style.transform = `rotate(${i * (360 / 50)}deg)`;
              span.style.animation = "blink 3s linear infinite";
              span.style.animationDelay = `${i * (3 / 50)}s`;
              container.appendChild(span);
            }
          </script>

          <style>
            @keyframes blink {
              0% {
                background: #0ef;
              }
              25% {
                background: #2c4766;
              }
            }
          </style>
        </body>
      </html>
    </main>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      var swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: {
          delay: 3000, // 5 sec
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          type: "progressbar",
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
      });
    </script>
